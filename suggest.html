<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suggest a show — Slime Tutorials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div>
        <a href="/" class="wordmark" style="font-size: 1.4rem;">Slime <span>Tutorials</span></a>
      </div>
      <div class="header-actions">
        <a href="/" class="btn btn-quiet">Back to archive</a>
      </div>
    </div>
  </header>

  <main class="wrap" style="max-width: 640px;">
    <h1 class="entry-title" style="margin-top: 32px;">Suggest a show</h1>
    <p style="color: var(--ink-dim);">Tell us what you found. Every suggestion is reviewed by hand before it joins the archive, so it may take a while to appear, or it may not appear at all.</p>

    <form class="panel" id="suggestForm">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div class="field">
        <label for="link">Link</label>
        <input type="url" id="link" name="link" placeholder="Where can it be found or watched">
      </div>

      <div class="field">
        <label for="poster">Cover image URL</label>
        <input type="url" id="poster" name="poster" placeholder="Optional, leave blank if you do not have one">
      </div>

      <div class="field">
        <label for="notes">Why it belongs here</label>
        <textarea id="notes" name="notes" placeholder="A sentence or two is plenty"></textarea>
      </div>

      <div class="field">
        <label for="submittedBy">Your name or handle</label>
        <input type="text" id="submittedBy" name="submittedBy" placeholder="Optional">
      </div>

      <button type="submit" class="btn btn-solid">Send suggestion</button>
      <p class="form-status" id="formStatus"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Slime Tutorials is a personal archive.</p>
    </div>
  </footer>

  <script src="/suggest.js"></script>
</body>
</html>
